name: Sync Upstream

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Run Upstream Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_OWNER: ${{ github.repository_owner }}
          FORK_REPO: uptime-kuma
          UPSTREAM_REPO: louislam/uptime-kuma
          BASE_BRANCH: master
        run: node extra/sync-upstream.mjs
